version: 2
models:
  - name: src_campaign_employee
    description: TBD
    columns:
    - name: employee_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: employee_name
      description: TBD
      data_tests:
        - not_null
  - name: src_campaign_product_type #Review tests (uniqueness and campaign_id relationships)
    description: TBD
    columns:
    - name: campaign_product_type_id
      description: TBD
      data_tests:
        - not_null
    - name: campaign_id
      description: TBD
      data_tests:
        - not_null
    - name: product_type_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_product_type')
              field: product_type_id
    - name: forecast_quantity
      description: TBD
      data_tests:
        - not_null
        - dbt_utils.expression_is_true:
            arguments:
              expression: ">0"
  - name: src_campaign_product #Review tests (uniqueness and campaign_id relationships)
    description: TBD
    columns:
    - name: campaign_id
      description: TBD
      data_tests:
        - not_null
    - name: campaign_product_id
      description: TBD
      data_tests:
        - not_null
    - name: product_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_product')
              field: product_id
    - name: forecast_quantity
      description: TBD
      data_tests:
        - not_null
        - dbt_utils.expression_is_true:
            arguments:
              expression: ">0"
  - name: src_campaign #Review tests (relationships with campaign_id in src_campaign_product and src_campaign_product_type)
    description: TBD
    columns:
    - name: campaign_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: campaign_name
      description: TBD
      data_tests:
        - not_null
    - name: employee_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_campaign_employee')
              field: employee_id
    - name: start_date
      description: TBD
      data_tests:
        - not_null
    - name: end_date
      description: TBD
      data_tests:
        - not_null
        - dbt_utils.expression_is_true:
            arguments:
              expression: "> start_date"
    - name: discount_perc
      description: TBD
      data_tests:
        - not_null
        - dbt_utils.expression_is_true:
            arguments:
              expression: ">= 20 AND discount_perc <= 40"
  - name: src_order_line
    description: TBD
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns: ['order_id', 'product_id']
    columns:
    - name: order_line_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: order_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_order')
              field: order_id
    - name: product_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_product')
              field: product_id
    - name: quantity
      description: TBD
      data_tests:
        - not_null
        - dbt_utils.expression_is_true:
            arguments:
              expression: "> 0"
  - name: src_order
    description: TBD
    columns:
    - name: order_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: order_date
      description: TBD
      data_tests:
        - not_null
    - name: store_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_store')
              field: store_id
  - name: src_product_type
    description: TBD
    columns:
    - name: product_type_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: product_type_name
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: team_id
      description: TBD
      data_tests:
        - not_null
  - name: src_product
    description: TBD
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns: ['product_type_id', 'product_name']
    columns:
    - name: product_id
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: product_type_id
      description: TBD
      data_tests:
        - not_null
        - relationships:
            arguments:
              to: ref('src_product_type')
              field: product_type_id
    - name: product_name
      description: TBD
      data_tests:
        - not_null
        - unique
  - name: src_store
    description: TBD
    data_tests:
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns: ['store_name', 'store_address']
    columns:
    - name: store_id  
      description: TBD
      data_tests:
        - not_null
        - unique
    - name: store_name
      description: TBD
      data_tests:
        - not_null
    - name: store_address
      description: TBD
      data_tests:
        - not_null
    - name: store_type_id
      description: TBD
      data_tests:
        - not_null